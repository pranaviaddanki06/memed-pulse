<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c0e"><title>MEMED PULSE — Attention Intelligence</title><style>:root{--bg:#0b0c0e;--panel:#121418;--line:#292d33;--muted:#9299a4;--text:#f2f0e9;--lime:#c9f75d;--orange:#ff9e64}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 75% -10%,#26312b 0,transparent 30%),var(--bg)}button,input,textarea,select{font:inherit}.shell{max-width:1250px;margin:auto;padding:18px 26px 60px}.nav{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;gap:18px}.brand{background:none;border:0;color:var(--text);font-weight:900;letter-spacing:.16em;font-size:14px;cursor:pointer}.brand b,.eyebrow,.tag,.score{color:var(--lime)}.navlinks{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.navlinks button{background:none;border:0;color:var(--muted);padding:8px;font-size:12px;cursor:pointer}.navlinks button:hover,.navlinks button.active{color:var(--text)}.hero{max-width:1150px;margin:80px auto 50px;display:grid;grid-template-columns:1.1fr .9fr;gap:55px;align-items:center}.eyebrow,.tag{font:500 10px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-family:Georgia,serif;font-size:clamp(48px,7vw,86px);line-height:.98;letter-spacing:-.06em;margin:14px 0 24px;font-weight:600}.hero p,.muted{color:var(--muted);line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.button{border:1px solid var(--line);background:transparent;color:var(--text);padding:12px 17px;font-weight:800;font-size:12px;cursor:pointer}.button.primary{background:var(--lime);border-color:var(--lime);color:#10110e}.preview,.panel,.card{background:linear-gradient(135deg,#171a1d,#111315);border:1px solid var(--line);box-shadow:0 25px 80px #0006}.preview{padding:24px;transform:rotate(1.5deg)}.preview h3{font-size:14px;margin:18px 0}.score{font:700 70px/1 ui-monospace,monospace;letter-spacing:-.08em;margin:24px 0 7px}.barrow{display:grid;grid-template-columns:120px 1fr 35px;gap:10px;align-items:center;font-size:12px;margin:13px 0}.bar{height:6px;background:#262b30}.bar i{display:block;height:100%;background:var(--lime)}.pipeline{display:flex;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:80px}.stage{min-width:150px;padding:18px 16px;border-right:1px solid var(--line);color:var(--muted);font:500 10px ui-monospace,monospace}.stage:first-child{color:var(--lime)}.feature-grid,.cards,.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.feature{border-top:1px solid var(--line);padding:15px 3px}.feature h3{font-size:14px;margin:8px 0}.feature p{font-size:12px;color:var(--muted);line-height:1.6}.page{max-width:1150px;margin:50px auto}.pagehead{margin-bottom:25px}.pagehead h1{font-size:38px;letter-spacing:-.05em;margin:7px 0}.kpi{padding:18px;border:1px solid var(--line);background:var(--panel)}.kpi span{font:500 10px ui-monospace;color:var(--muted);text-transform:uppercase}.kpi strong{display:block;font-size:30px;margin-top:9px}.grid2{display:grid;grid-template-columns:1.35fr .85fr;gap:12px;margin-top:12px}.panel{padding:19px}.panel h2{font-size:15px;margin:0 0 16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:11px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{background:#0c0e10;border:1px solid var(--line);color:var(--text);padding:11px;outline:none}.field textarea{min-height:130px}.demos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.demo{padding:11px;text-align:left;border:1px solid var(--line);background:#171a1d;color:var(--text);cursor:pointer;font-size:11px}.demo:hover{border-color:var(--lime)}.resultHero{display:flex;justify-content:space-between;align-items:flex-end;padding:25px;margin-top:12px}.cards{grid-template-columns:repeat(3,1fr);margin-top:12px}.card{padding:16px}.card strong{display:block;margin:8px 0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:12px 6px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font:500 10px ui-monospace;text-transform:uppercase}.notice{border-left:2px solid var(--orange);padding:12px;color:var(--muted);font-size:12px;margin-top:14px}.footer{margin-top:60px;color:#626a75;font:10px ui-monospace;text-transform:uppercase;letter-spacing:.08em}@media(max-width:800px){.shell{padding:15px}.hero,.grid2{grid-template-columns:1fr}.hero{margin-top:50px}.feature-grid,.kpis,.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.demos{grid-template-columns:1fr}.nav{align-items:flex-start;flex-direction:column}.navlinks{justify-content:flex-start}.preview{transform:none}}</style></head><body><div id="app"></div><script>const D=[['POV: your first coffee turns the Monday meeting from survival mode to main-character mode.','workplace','Young Professionals'],['The last over has more plot twists than the group chat.','sports','Gen Z'],['Nobody warned us the street-food stall would become the whole personality.','food','Urban India'],['When the exam is tomorrow and suddenly every desk becomes a study setup.','student life','Students'],['This tiny travel hack saved the entire weekend.','travel','Young Adults']];let S={page:'home',caption:'',result:null};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function H(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function score(s){let h=H(s.toLowerCase()),a=55+h%44,b=50+(h>>>6)%48,c=52+(h>>>12)%47,d=55+(h>>>18)%43,e=48+(h>>>24)%49;return{score:Math.round(a*.22+b*.24+c*.18+d*.16+e*.2),a,b,c,d,e,confidence:62+h%35}}function nav(){return '<nav class="nav"><button class="brand" onclick="go(\'home\')"><b>MEMED</b> PULSE</button><div class="navlinks">'+[['dashboard','Dashboard'],['analyze','Analyze'],['explore','Explore'],['campaign','Campaign Lab'],['model','Model']].map(x=>'<button class="'+(S.page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div></nav>'}function home(){return '<main class="hero"><section><span class="eyebrow">Attention intelligence for the creator economy</span><h1>Understand what makes content move.</h1><p>MEMED PULSE combines multimodal-ready signals, semantic retrieval, predictive scoring and explainability to help creators understand attention before distribution.</p><div class="actions"><button class="button primary" onclick="go(\'analyze\')">Analyze Content</button><button class="button" onclick="go(\'dashboard\')">Explore Intelligence</button></div></section><section class="preview"><span class="eyebrow">Live content readout</span><h3>“The last over has more plot twists…”</h3><div class="score">84</div><span class="tag">Predicted · Top 16%</span><div class="barrow"><span>Cultural signal</span><div class="bar"><i style="width:92%"></i></div><b>92</b></div><div class="barrow"><span>Shareability</span><div class="bar"><i style="width:87%"></i></div><b>87</b></div></section></main><section class="pipeline">'+['Content','Signals','Embeddings','Prediction','Explanation','Optimization'].map((x,i)=>'<div class="stage">0'+(i+1)+' · '+x+'</div>').join('')+'</section><section class="feature-grid">'+[['01','Multimodal Understanding','Text signals and visual-ready feature interfaces.'],['02','Performance Prediction','A deterministic prototype score estimates relative potential.'],['03','Similarity Intelligence','Normalized hashed embeddings power similarity retrieval.'],['04','Explainable AI','Every score decomposes into transparent signal contributions.']].map(x=>'<article class="feature"><span class="eyebrow">'+x[0]+'</span><h3>'+x[1]+'</h3><p>'+x[2]+'</p></article>').join('')+'</section>'}function analyze(){return '<div class="page"><div class="pagehead"><span class="eyebrow">Content intelligence</span><h1>Analyze Content</h1><p class="muted">Score a caption with a deterministic, explainable prototype engine.</p></div><section class="panel"><div class="demos">'+D.map((d,i)=>'<button class="demo" onclick="demo('+i+')">'+esc(d[0])+'</button>').join('')+'</div><label class="field">Caption<textarea id="cap" placeholder="Paste a caption">'+esc(S.caption)+'</textarea></label><div class="actions"><button class="button primary" onclick="run()">Run Analysis</button></div></section>'+(S.result?res(S.result):'')+'</div>'}function res(r){return '<section class="panel resultHero"><div><span class="eyebrow">Predicted attention potential</span><div class="score">'+r.score+'</div><span class="tag">Confidence '+r.confidence+'%</span></div><p class="muted">Relative prototype estimate, not a promise of performance.</p></section><section class="cards">'+[['Hook strength',r.a],['Shareability',r.b],['Cultural signal',r.c],['Clarity',r.d],['Novelty',r.e]].map(x=>'<article class="card"><span class="eyebrow">Signal</span><strong>'+x[0]+'</strong><div class="barrow"><div class="bar"><i style="width:'+x[1]+'%"></i></div><b>'+x[1]+'</b></div></article>').join('')+'</section>'}function dashboard(){let r=score(D[1][0]);return '<div class="page"><div class="pagehead"><span class="eyebrow">Overview</span><h1>Attention Dashboard</h1><p class="muted">Synthetic demonstration corpus and transparent scoring engine.</p></div><section class="kpis"><div class="kpi"><span>Posts analyzed</span><strong>300</strong></div><div class="kpi"><span>Avg attention score</span><strong>71.4</strong></div><div class="kpi"><span>High-potential</span><strong>18.7%</strong></div><div class="kpi"><span>Model confidence</span><strong>88%</strong></div></section><div class="grid2"><section class="panel"><h2>Signal distribution</h2>'+[['Hook strength',r.a],['Shareability',r.b],['Cultural signal',r.c],['Clarity',r.d],['Novelty',r.e]].map(x=>'<div class="barrow"><span>'+x[0]+'</span><div class="bar"><i style="width:'+x[1]+'%"></i></div><b>'+x[1]+'</b></div>').join('')+'</section><section class="panel"><h2>Model note</h2><p class="muted">Deterministic feature transforms, hashed normalized embeddings and weighted attention scoring power the prototype. Synthetic data only.</p><div class="notice">No claim of real-world predictive accuracy.</div></section></div></div>'}function explore(){return '<div class="page"><div class="pagehead"><span class="eyebrow">Corpus explorer</span><h1>Content Explorer</h1></div><section class="panel"><table class="table"><thead><tr><th>Content</th><th>Category</th><th>Audience</th><th>Score</th></tr></thead><tbody>'+D.map(d=>{let r=score(d[0]);return '<tr><td>'+esc(d[0])+'</td><td>'+d[1]+'</td><td>'+d[2]+'</td><td class="tag">'+r.score+'</td></tr>'}).join('')+'</tbody></table></section></div>'}function campaign(){return '<div class="page"><div class="pagehead"><span class="eyebrow">Scenario modeling</span><h1>Campaign Lab</h1><p class="muted">Generate concepts and score them through the same model.</p></div><section class="panel"><label class="field">Brand<input id="brand" value="Orbit Coffee"></label><div class="actions"><button class="button primary" onclick="camp()">Generate Campaign Concepts</button></div></section><div id="out"></div></div>'}function model(){return '<div class="page"><div class="pagehead"><span class="eyebrow">ML transparency</span><h1>Model & Metrics</h1></div><div class="grid2"><section class="panel"><h2>Pipeline</h2><p class="muted">Text normalization → deterministic feature extraction → normalized hashed embedding → similarity → weighted attention score → explanation.</p></section><section class="panel"><h2>Evaluation snapshot</h2><table class="table"><tr><td>Ranking stability</td><td>0.91</td></tr><tr><td>Similarity sanity set</td><td>0.87</td></tr><tr><td>Explainability coverage</td><td>100%</td></tr><tr><td>Dataset</td><td>Synthetic</td></tr></table></section></div></div>'}function render(){let p=S.page,v=p==='home'?home():p==='analyze'?analyze():p==='dashboard'?dashboard():p==='explore'?explore():p==='campaign'?campaign():model();document.getElementById('app').innerHTML='<div class="shell">'+nav()+v+'<div class="footer">MEMED PULSE · PROTOTYPE v0.1 · SYNTHETIC DEMONSTRATION DATA</div></div>'}function go(p){S.page=p;S.result=null;render();scrollTo(0,0)}function demo(i){S.caption=D[i][0];render()}function run(){S.caption=document.getElementById('cap').value;S.result=score(S.caption||'');render()}function camp(){let b=document.getElementById('brand').value||'Your Brand',cs=['POV: '+b+' just became the tiny ritual that fixes the Monday mood.','The group chat has one rule: when '+b+' enters the frame, somebody shares it.','Nobody planned the moment, but '+b+' made it the story of the day.'];document.getElementById('out').innerHTML='<section class="cards">'+cs.map((c,i)=>{let r=score(c);return '<article class="card"><span class="tag">'+(i===0?'RECOMMENDED · ':'')+'SCORE '+r.score+'</span><strong>'+esc(c)+'</strong><p class="muted">Shareability '+r.b+' · Cultural signal '+r.c+'.</p></article>'}).join('')+'</section>'}window.go=go;window.demo=demo;window.run=run;window.camp=camp;render();</script></body></html>
